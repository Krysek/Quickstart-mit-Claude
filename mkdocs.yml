# Konfiguration der Dokumentations-Website (MkDocs mit Material-Theme).
#
# Die Seiten in docs/ sind fertiges Markdown (erzeugt mit tools/gen_docs.py),
# das auch GitHub direkt anzeigt. MkDocs macht daraus zusätzlich eine Website.
#
# Lokal ansehen:  mkdocs serve        -> http://127.0.0.1:8000
# Bauen:          mkdocs build --strict  (Ergebnis im Ordner site/)

site_name: Tetris in Schwarz/Weiß
site_description: Dokumentation zum Tetris-Quickstart-Projekt in Python
repo_url: https://github.com/Krysek/Quickstart-mit-Claude
repo_name: Krysek/Quickstart-mit-Claude
edit_uri: edit/main/docs/
# Links auf .html-Dateien, damit die Website auch entpackt per Doppelklick läuft.
use_directory_urls: false

theme:
  name: material
  language: de
  icon:
    logo: material/view-grid
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/weather-night
        name: Dunkles Design
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/weather-sunny
        name: Helles Design

nav:
  - Start: index.md
  - Architektur und Abläufe: architecture.md
  - API-Referenz:
      - model – Spielregeln: api/model.md
      - menu – Pausenmenü: api/menu.md
      - animation – Lösch-Animation: api/animation.md
      - view – Zeichnen: api/view.md
      - TetrisApp – Steuerung: api/app.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        # Mermaid-Diagramme werden im Browser als Grafik dargestellt.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: de
