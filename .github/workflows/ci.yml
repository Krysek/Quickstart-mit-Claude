# Automatische Prüfungen bei jedem Push und Pull Request.
#
#   test    Unit-Tests und Typprüfung (mypy --strict) mit mehreren Python-Versionen
#   docs    baut die Dokumentations-Website (mkdocs build --strict)
#   deploy  veröffentlicht die Website auf GitHub Pages; ist ausgeschaltet, bis
#           in den Repository-Einstellungen die Variable PAGES_ENABLED = true
#           gesetzt ist (Settings → Secrets and variables → Actions → Variables).
#           Achtung: GitHub-Pages-Seiten sind öffentlich, auch bei privaten Repos.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:      # erlaubt einen manuellen Start im Tab "Actions"

permissions:
  contents: read

jobs:
  test:
    name: Tests und mypy (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: Quickstart mit Claude
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: mypy installieren
        run: pip install mypy
      - name: Unit-Tests
        run: python -m unittest -v
      - name: Typprüfung
        run: mypy --strict model.py menu.py animation.py view.py Quickstart_mit_Claude.py

  docs:
    name: Dokumentation bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Werkzeuge installieren
        run: pip install -r requirements-dev.txt
      - name: Website bauen
        run: mkdocs build --strict
      - name: Website für GitHub Pages bereitstellen
        if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Auf GitHub Pages veröffentlichen
    needs: [test, docs]
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
